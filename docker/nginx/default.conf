# Subdomain reverse proxy for the demo UIs — everything on :80, no port numbers.
#
#   gamma.localhost   -> gamma-console   (+ /gamma/ + /management/ proxied to apim-rest-api)
#   am.localhost      -> AM webui        (+ /management/ proxied to AM management)
#   apim.localhost    -> APIM console    (+ /management/ proxied to apim-rest-api)
#   portal.localhost  -> APIM portal     (+ /portal/ + /management/ proxied to apim-rest-api)
#
# Each UI's API is proxied on its own host so browser calls stay same-origin —
# that's why no CORS/CSRF config is needed on the backends.
#
# *.localhost resolves to 127.0.0.1 in modern browsers. If yours doesn't, add:
#   127.0.0.1  gamma.localhost am.localhost apim.localhost portal.localhost
# to /etc/hosts.

# Docker's embedded DNS. Upstreams are passed via a variable so they resolve at
# REQUEST time, not config-load time — nginx then starts even when a backend
# (e.g. AM while its license is sorted) is down, and just 502s until it's up.
resolver 127.0.0.11 ipv6=off valid=10s;

# Shared proxy behaviour (headers + websocket upgrade) for the SPA containers.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

server {
    listen 80;
    server_name gamma.localhost;

    # The rest-api builds the console's bootstrap URLs from the single global
    # gravitee_installation_api_url (apim.localhost) — so the gamma console would
    # otherwise call apim.localhost cross-origin and its Lax auth cookie (set on
    # apim.localhost) never rides along → login 401. Rewrite apim.localhost ->
    # gamma.localhost in the proxied JSON so the gamma console stays same-origin.
    # (Accept-Encoding cleared so the upstream sends plaintext sub_filter can edit.)
    # NOTE: a per-location proxy_set_header drops ALL the http-level ones (nginx
    # replaces, never merges) — so re-state Host/X-Forwarded-* here, otherwise
    # the rest-api would see Host: apim-rest-api on exactly the auth routes.
    location /gamma/ {
        set $up http://apim-rest-api:8083;
        proxy_pass $up$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding   "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'apim.localhost' 'gamma.localhost';
    }
    # auth + standard management API (login lives at /management/organizations/...)
    location /management/ {
        set $up http://apim-rest-api:8083;
        proxy_pass $up$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding   "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'apim.localhost' 'gamma.localhost';
    }
    location / {
        set $up http://gamma-console:8080;
        proxy_pass $up$request_uri;
        # gamma-console's nginx 404s on client-side routes (e.g. /login) instead
        # of serving the SPA shell — fall back to its index for any 404.
        proxy_intercept_errors on;
        error_page 404 = @gamma_spa;
    }
    location @gamma_spa {
        set $up http://gamma-console:8080;
        proxy_pass $up/;
    }
}

server {
    listen 80;
    server_name am.localhost;

    location /management/ {
        set $up http://management:8093;
        proxy_pass $up$request_uri;
    }
    location / {
        set $up http://webui:8080;
        proxy_pass $up$request_uri;
    }
}

server {
    listen 80;
    server_name apim.localhost;

    location /management/ {
        set $up http://apim-rest-api:8083;
        proxy_pass $up$request_uri;
    }
    location / {
        set $up http://apim-console:8080;
        proxy_pass $up$request_uri;
    }
}

server {
    listen 80;
    server_name portal.localhost;

    location /portal/ {
        set $up http://apim-rest-api:8083;
        proxy_pass $up$request_uri;
    }
    location /management/ {
        set $up http://apim-rest-api:8083;
        proxy_pass $up$request_uri;
    }
    location / {
        set $up http://apim-portal:8080;
        proxy_pass $up$request_uri;
    }
}
